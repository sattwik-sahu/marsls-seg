data:
  root_dir: /mnt/toshiba_hdd/code/robot-navigation/marsls-seg/data/marsls-seg/mmlsv2
  params_file: /mnt/toshiba_hdd/code/robot-navigation/marsls-seg/data/configs/mmls_norm.yaml
  processor:
    _target_: marsls_seg.utils.data.processing.MultimodalMarsLandslideDataProcessor
    params_file: ${data.params_file}
training:
  batch_size: 32
  lr: 0.0001
  num_workers: 4
  pin_memory: true
  eval_int: 1
  save_int: 50
  ckpt_dir: /mnt/toshiba_hdd/code/robot-navigation/marsls-seg/data/runs/ms-jepa
wandb:
  project: MarsLS-JEPA
  mode: online
model:
  _target_: marsls_seg.utils.modules.jepa.ijepa.IJEPA
  sigreg_lambda: 0.05
  encoder:
    _target_: marsls_seg.utils.modules.vit.VisionTransformer
    dim: 512
    n_heads: 8
    n_layers: 8
    patch_size: 8
    img_size: 128
    n_channels: 7
    n_groups: 4
  predictor:
    _target_: marsls_seg.utils.modules.jepa.ijepa.TransformerDecoderPredictor
    decoder:
      _target_: marsls_seg.utils.modules.tf.decoder.TransformerDecoder
      dim: 512
      n_heads: 8
      n_layers: 4
      n_groups: 4
  sigreg:
    _target_: marsls_seg.utils.modules.sigreg.SIGReg
    n_directions: 1024
    knots: 17
trainer:
  _target_: marsls_seg.utils.train.ijepa.IJEPATrainer
  mask_ratio:
  - 0.5
  - 0.9
  n_epochs: 500
