[project]
name = "marsls-seg"
version = "0.1.0"
description = "MARSLS Segmentation"
readme = "README.md"

authors = [
    { name = "Sattwik Kumar Sahu", email = "sattwik21@iiserb.ac.in" }
]

requires-python = ">=3.11,<3.12"

dependencies = [
    # Core DL stack
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    # Vision / transformers
    "timm>=1.0.24",
    "transformers>=4.46.0",
    "x-transformers>=2.16.1",
    # Segmentation
    "segmentation-models-pytorch>=0.5.0",
    # Data / IO
    "numpy>=1.26,<2.3",
    "tifffile>=2025.5.10",
    "imagecodecs>=2025.3.30",
    "pyyaml>=6.0.2",
    # Utilities
    "rich>=14.0.0",
    "typer>=0.12.0",
    # Optional experiment tools
    "wandb>=0.18.0",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.2",
    "tabulate>=0.10.0",
]

[dependency-groups]

dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "jupyter>=1.1.1",
]

train = [
    "scikit-learn>=1.5.0",
]

plot = [
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
]

[project.scripts]
marsls-seg = "marsls_seg:main"

[build-system]
requires = [
    "setuptools>=70.0.0",
    "wheel",
    
]
build-backend = "setuptools.build_meta"

[tool.uv]

# Prevent flash-attn isolated build failures
extra-build-dependencies = { flash-attn = ["torch", "setuptools", "wheel", "ninja", "packaging"] }
